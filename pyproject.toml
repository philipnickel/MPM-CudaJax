[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.24", "jax>=0.4.20", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "mpm-cudajax"
version = "0.1.0"
requires-python = ">=3.10"
description = "MLS-MPM benchmark: JAX/XLA vs hand-written CUDA"
dependencies = [
    "hydra-core>=1.3",
    "hydra-zen",
    "omegaconf",
    "matplotlib",
    "tqdm",
    "numpy",
    "warp-lang",
    "pyvista",
]

[tool.scikit-build]
# Tolerate config-settings injected by the build frontend. pixi >=0.70 passes a
# `pixi-conda-environment` config-setting to every PEP 517 build; with the
# default strict-config=true, scikit-build-core rejects that unknown key and
# aborts the editable build with SystemExit(7). Relaxing it makes the key a
# warning instead, so `pixi install` succeeds regardless of the local pixi rev.
strict-config = false
# Auto-rebuild the native CUDA extension on import when native sources change.
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mpm_jax"]
editable.rebuild = true
editable.verbose = false
# CUDA build is best-effort: when nvcc is missing CMake `return()`s and the
# wheel installs cleanly without kernels.
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
name = "mpm-cudajax"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
hydra-core = ">=1.3"
hydra-zen = "*"
omegaconf = "*"
matplotlib = "*"
tqdm = "*"
numpy = "*"
cmake = ">=3.24"
scikit-build-core = ">=0.10"
nanobind = "*"
ninja = "*"
seaborn = ">=0.13.2,<0.14"
pandas = ">=3.0.3,<4"
pyvista = "*"
imageio = "*"
# NOTE: `warp-lang` is intentionally NOT here. The conda-forge build pulls
# `jax` as a hard runtime dep, which would conflict with the PyPI-side
# `jax[cuda13]` package used by the default GPU environment below.

[tool.pixi.pypi-dependencies]
mpm-cudajax = { path = ".", editable = true }

[tool.pixi.pypi-options]
# Keep scikit-build-core editable builds tied to the Pixi environment instead
# of a temporary isolated build env. This is required for
# editable.rebuild=true to run incremental CMake rebuilds reliably on import.
no-build-isolation = ["mpm-cudajax"]

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.feature.gpu]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.gpu.dependencies]
cuda-version = "12.*"
cuda-nvcc = "*"
nsight-compute = ">=2025.2,<2025.3"
gxx = "*"
setuptools = "<81"

[tool.pixi.feature.gpu.pypi-dependencies]
nsight-python = "*"
warp-lang = "==1.14.0"
cuda-tile = { version = ">=1.4.0, <2", extras = ["tileiras"] }
jax = { version = ">=0.10.1, <0.11", extras = ["cuda13"] }
tensorboard = ">=2.20.0, <3"
xprof = ">=2.22.1, <3"
nsys-jax = { git = "https://github.com/NVIDIA/JAX-Toolbox.git", subdirectory = ".github/container/nsys_jax" }

[tool.pixi.feature.gpu.activation.env]
JAX_PLATFORMS = "cuda"
# Enable XLA command-buffer (CUDA Graph) capture for the whole frame loop:
# FUSION + CUSTOM_CALL (the FFI/cuTile scatters & fused G2P) + WHILE (the substep
# lax loop) are replayed as one graph per substep. Was an opt-in per-kernel flag
# (cuda_v3 cuda_graph=true); now on for every kernel in the default env.
XLA_FLAGS = "--xla_gpu_enable_command_buffer=FUSION,CUSTOM_CALL,WHILE"
JAX_COMPILATION_CACHE_DIR = "$PIXI_PROJECT_ROOT/.jax_cache"
JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS = "0"
JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES = "0"
PYVISTA_OFF_SCREEN = "true"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.0"
# Warp 1.14 ships a manylinux_2_34 aarch64 wheel (GH200) and a manylinux_2_28
# x86_64 wheel (H100). Declare the glibc floor so uv accepts the aarch64 wheel.
libc = { family = "glibc", version = "2.34" }

[tool.pixi.environments]
default = { features = ["gpu", "dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/ -v"
lint = "ruff check ."
clean = { cmd = "rm -f src/mpm_jax/cuda/_p2g_ffi*.so *.sqlite *.nsys-rep && rm -rf multirun outputs output traces dist .pytest_cache .ruff_cache .jax_cache *.egg-info src/*.egg-info && find . -path ./.pixi -prune -o -type d -name __pycache__ -print0 | xargs -0 rm -rf" }
sim = "python simulate.py"
sweep = "python simulate.py -cn sweep_baseline"
sweep-quick = "python simulate.py -cn sweep_quick"
sweep-all = "python simulate.py -cn sweep_all"

# Push the working tree to a remote host (e.g. `pixi run sync lambda`).
# Excludes generated dirs/caches; the remote rebuilds native artifacts on its
# own `pixi install`.
sync = { args = [{ arg = "host" }], cmd = "rsync -ahz --info=stats1,name0 --exclude=.pixi --exclude=.venv --exclude=build --exclude=dist --exclude=outputs --exclude=multirun --exclude=output --exclude=.jax_cache --exclude=.ruff_cache --exclude=traces --exclude='*.nsys-rep' --exclude='src/mpm_jax/cuda/_p2g_ffi*.so' --exclude=__pycache__ --exclude='*.sqlite' --exclude='*.egg-info' --exclude=.pytest_cache ./ {{ host }}:~/MPM-CudaJax/" }

# Pull Hydra run outputs back from a remote host (e.g. `pixi run sync-results lambda`).
# One rsync with include/exclude rules so missing source dirs are silently skipped.
sync-results = { args = [{ arg = "host" }], cmd = "rsync -ahz --info=stats1,name0 --include='outputs/' --include='outputs/**' --include='multirun/' --include='multirun/**' --include='output/' --include='output/**' --exclude='*' {{ host }}:~/MPM-CudaJax/ ./" }

[tool.pixi.feature.gpu.target.linux-64.pypi-dependencies]
pyglet = ">=2.0"
usd-core = ">=26.5, <27"
