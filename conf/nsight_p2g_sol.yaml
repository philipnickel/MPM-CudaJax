# Speed-of-light utilization data for isolated P2G variants.
#
# Tiny defaults are intentional; scale n_particles up only when collecting final
# report data.
#
# Run:
#   pixi run -e gpu python profile_nsight.py -cn nsight_p2g_sol
defaults:
  - nsight_profile
  - _self_

kernel:
  name: cuda_v1_inline

nsight:
  analyze:
    runs: 1
    metric_preset: speed_of_light
    derive_metric: speed_of_light
    replay_mode: range
    combine_kernel_metrics: null
    output_csv: true
  plot:
    enabled: false
    metric: sol_max_pct
    ylabel: Speed-of-light utilization (%)
    filename: nsight_p2g_sol.png
    title: P2G Speed-of-Light Utilization
  sweep:
    kernels:
      - cuda_v1_inline
      - cuda_v2_inline
      - cuda_v3_inline
      - cuda_v4_inline
      - cutile_v6_atomic_tile
    n_particles:
      - 65536
    num_grids:
      - 32
    steps_per_frame:
      - 1

sim:
  n_particles: 65536
  num_grids: 32
  num_frames: 1
  steps_per_frame: 1
