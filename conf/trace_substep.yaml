# Focused single-substep capture for inspecting the JAX P2G fusions/HLO in
# detail. One backend, one frame, one substep -> the smallest possible XLA
# module, so the XProf Graph Viewer / Op Profile show the P2G fusion structure
# cleanly. Writes to traces/<label>/ separate from the backend-comparison runs.
#
#   pixi run python simulate.py -cn trace_substep
#   pixi run xprof --logdir traces      # -> "jax_p2g_substep" run, Graph Viewer
defaults:
  - config
  - override /sim: benchmark
  - _self_

render:
  enabled: false

profile:
  enabled: true
  label: jax_p2g_substep

# backend defaults to jax (conf/config.yaml); override on the CLI for others.

sim:
  steps_per_frame: 1
  num_frames: 1
