defaults:
    - _self_
    - material: jelly
    - sim: default
    - backend: jax

solver:
    _target_: mpm_jax.solver.RuntimeConfig
    _recursive_: false
    material: ${material}
    sim: ${sim}
    backend: ${backend}

tag: jelly

# CUDA MPS active-thread % (set by shell loop)
mps_thread_percent: null

# JAX/XProf profiling
profile:
    enabled: false
    label: null # trace run name
    disable_command_buffers: true # keeps kernels visible
    warmup_frames: 1 # throwaway frames
    options: # splatted onto ProfileOptions
        host_tracer_level: 2 # 0 off..3 verbose
        python_tracer_level: 1 # 1 -> source attribution
        enable_hlo_proto: true # powers Graph Viewer
        advanced_configuration: # CUPTI tracer
            gpu_enable_cupti_activity_graph_trace: true

render:
    enabled: true
    fps: 30
    point_radius: 0.008
    width: 960
    height: 720

hydra:
    run:
        dir: outputs/runs/${gpu_kind:}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    sweep:
        dir: outputs/sweeps/${gpu_kind:}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
        subdir: ${hydra.job.num}_${hydra.job.override_dirname}
    job:
        config:
            override_dirname:
                kv_sep: "="
                item_sep: ","
                exclude_keys:
                    - render.enabled
                    - profile.enabled
