defaults:
  - material: jelly
  - sim: default
  - backend: jax
  - _self_

solver:
  _target_: mpm_jax.solver.RuntimeConfig
  _recursive_: false
  material: ${material}
  sim: ${sim}
  backend: ${backend}

tag: jelly

# JAX/XProf profiling. Writes a TensorBoard trace to traces/<label>/ (CUDA
# streams + graphs, named-scope phases, HLO graph/op stats, memory). Warmup runs
# outside the trace so one-time JIT compilation is not captured. View with
# `pixi run xprof --logdir traces` (the standalone XProf viewer); for a remote
# run, SSH-forward the port (see the README "Profiling" section).
profile:
  enabled: false
  label: null               # trace run name (null -> backend name); set to keep a focused capture separate
  warmup_frames: 1          # throwaway frames before the trace starts
  step_mode: frame           # frame = jitted fori_loop; staged = per-stage jitted substeps
  options:                  # splatted onto jax.profiler.ProfileOptions via setattr
    host_tracer_level: 2      # 0 off, 1 user events, 2 high-level, 3 verbose
    python_tracer_level: 1    # 1 -> Python source attribution (0 to reduce overhead)
    enable_hlo_proto: true    # powers Graph Viewer + HLO Op Stats
    advanced_configuration:   # forwarded to the CUPTI tracer
      # Trace kernels INSIDE CUDA graphs (XLA command buffers) so the named-scope
      # phases stay visible without disabling graph capture. Defaults to false,
      # which collapses the whole frame into one opaque graph-launch event.
      gpu_enable_cupti_activity_graph_trace: true

render:
  enabled: true
  fps: 30
  point_radius: 0.008
  width: 960
  height: 720
