defaults:
  - material: sand_jacobi
  - sim: default
  - kernel: jax_baseline
  - solver: default      # hydra-zen Solver graph (registered in mpm_jax.zen_build)
  - profile: none
  - _self_

output_dir: ./output
tag: sand_jacobi
benchmark: false  # skip GIF rendering and frame saving when true
render:
  backend: pyvista_gif  # pyvista_gif | warp_opengl | warp_usd | ovrtx_mp4
  fps: 30
  point_radius: 0.008
  width: 960
  height: 720
  write_usd: false
