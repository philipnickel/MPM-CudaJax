defaults:
  - material: jelly
  - sim: benchmark
  - backend: jax
  - profile: none
  - _self_

solver:
  _target_: mpm_jax.solver.RuntimeConfig
  _recursive_: false
  material: ${material}
  sim: ${sim}
  backend: ${backend}

output_dir: ./output
tag: jelly
benchmark: false  # skip GIF rendering and frame saving when true
render:
  backend: pyvista_gif  # pyvista_gif | warp_opengl | warp_usd | ovrtx_mp4
  fps: 30
  point_radius: 0.008
  width: 960
  height: 720
  write_usd: false
