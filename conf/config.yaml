defaults:
  - material: jelly
  - sim: benchmark
  - backend: jax
  - profile: none
  - _self_

solver:
  _target_: mpm_jax.solver.RuntimeConfig
  _recursive_: false
  material: ${material}
  sim: ${sim}
  backend: ${backend}

tag: jelly
benchmark: false  # skip GIF rendering and frame saving when true
render:
  fps: 30
  point_radius: 0.008
  width: 960
  height: 720
