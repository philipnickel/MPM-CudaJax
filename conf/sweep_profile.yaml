# Profile sweep: all kernels with the JAX profiler.
# Usage: pixi run -e gpu python simulate.py -cn sweep_profile
#
# Note: cuda_v6_inline was removed; CUDA-Graph capture of cuda_v3_inline is
# tested via: kernel=cuda_v3_inline kernel.cuda_graph=true
defaults:
  - config
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      kernel: jax,jax_v1_5,warp_v1_inline,warp_v3_supercell_tile,cuda_v2_inline,cuda_v3_inline
      profile: jax

benchmark: true
tag: profile
sim:
  num_frames: 3
  n_particles: 10000
  num_grids: 64
