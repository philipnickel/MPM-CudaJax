# cutile_v4_arena -- SPGrid-style colored arena-scatter P2G through cuTile JAX FFI.
# The fastest P2G in the registry: beats the hand-written CUDA super-cell kernel.
#
# JAX sorts particles by home super-cell (SC=2). Each cuTile block reduces its OWN
# super-cell's particles (read once -- no gather redundancy) into a 4^3 = 64-node
# L1-resident arena tile, then writes the arena back to the global grid with a
# plain NON-atomic read-modify-write. The P2G is launched 8 times, once per colour
# (parity of super-cell coords), so within a launch no two blocks share a grid node
# -- making the write-back race-free WITHOUT atomics. Requires num_grids % 4 == 0.
name: cutile_v4_arena
