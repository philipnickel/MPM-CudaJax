# Backend kernel sweep entry point (axes in conf/sweep/)
defaults:
    - config
    - sweep: particle_count
    - override /sim: benchmark
    - _self_

hydra:
    mode: MULTIRUN
    sweeper:
        params:
            backend: jax,cuda_v1,cuda_v2,cuda_v3,CuTile
    callbacks:
        scaling_plot:
            _target_: postprocessing.callbacks.ScalingPlotCallback

# Enough substeps to average past warmup
sim:
    steps_per_frame: 10

render:
    enabled: false
