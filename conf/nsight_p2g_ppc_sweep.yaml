# Particles-per-cell contention sweep for isolated P2G variants.
#
# Fixed grid with small particle counts. For final data, extend the n_particles
# list while keeping num_grids fixed so ppc = n_particles / num_grids**3.
#
# Run:
#   pixi run -e gpu python profile_nsight.py -cn nsight_p2g_ppc_sweep
defaults:
  - nsight_profile
  - _self_

kernel:
  name: cuda_v1_inline

nsight:
  analyze:
    runs: 1
    metric_presets:
      - time
      - memory_locality
      - atomics
    derive_metric: diagnostics
    replay_mode: kernel
    combine_kernel_metrics: sum
    output_csv: true
  plot:
    enabled: false
    metric: p2g_mparticles_per_s
    ylabel: P2G throughput (M particles/s)
    filename: nsight_p2g_ppc_sweep.png
    title: P2G Particles-per-Cell Sweep
  sweep:
    kernels:
      - cuda_v1_inline
      - cuda_v2_inline
      - cuda_v3_inline
      - cuda_v4_inline
      - cutile_v6_atomic_tile
      - warp_v3_supercell_tile
    n_particles:
      - 32768
      - 65536
      - 131072
      - 262144
    num_grids:
      - 32
    steps_per_frame:
      - 1

sim:
  n_particles: 65536
  num_grids: 32
  num_frames: 1
  steps_per_frame: 1
