# Full comparison sweep: JAX variants vs inline CUDA kernels.
#
# Usage: pixi run python simulate.py -cn sweep_all
#
# Build CUDA kernels first: pixi install
defaults:
    - config
    - override /sim: benchmark
    - _self_

hydra:
    mode: MULTIRUN
    sweeper:
        params:
            backend: jax,cuda_v1,cuda_v2,cuda_v3,cuda_v4,cutile_v1,cutile_v2

render:
    enabled: false
tag: sweep_all
