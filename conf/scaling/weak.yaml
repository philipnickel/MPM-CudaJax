# @package _global_
# Scaling axis: weak scaling at fixed active-cell PPC (~9.31); the grid is
# derived from the swept N via the ${ppc_grid:N} resolver. Single source of the
# swept particle-count list + grid derivation, shared by the timing and NCU
# wrappers.
hydra:
    sweeper:
        params:
            sim.n_particles: 250000,500000,1000000,5000000,10000000,15000000,20000000,25000000,30000000

sim:
    num_grids: ${ppc_grid:${sim.n_particles}}
