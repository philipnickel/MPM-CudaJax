# @package _global_
# Weak scaling at fixed active-cell particles per cell. Swept axis values + grid
# derivation live in conf/scaling/weak.yaml (shared with the timing sweep).
# _self_ first keeps the backend sweep axis ahead of the shared sim axis, so
# multirun job indexing and output dirnames are unchanged.
defaults:
  - _self_
  - /scaling: weak

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      backend: cuda_v1,cuda_v2,cuda_v3,CuTile

tag: nsight_weak
