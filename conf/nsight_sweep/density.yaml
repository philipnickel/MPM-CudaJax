# @package _global_
# Fixed N=20M, growing grid resolution. Swept axis values + fixed N live in
# conf/scaling/density.yaml (shared with the timing sweep).
# _self_ first keeps the backend sweep axis ahead of the shared sim axis, so
# multirun job indexing and output dirnames are unchanged.
defaults:
  - _self_
  - /scaling: density

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      backend: cuda_v1,cuda_v2,cuda_v3,CuTile
