# @package _global_
# Constant active PPC (~9.3), particle count up. Swept axis values + grid
# derivation live in conf/scaling/weak.yaml (shared with the NCU sweep).
defaults:
    - /scaling: weak
    - /plot@plots.time: loglog
    - /plot@plots.throughput: loglog
    - /plot@plots.speedup: speedup
    - _self_

tag: sweep_weak_scaling

plots:
    time:
        x: n_particles
        xlabel: particles
        y: ms_per_step
        ylabel: ms / substep
        title: "Time per step (fixed PPC)"
        filename: ms_per_substep.png
    throughput:
        x: n_particles
        xlabel: particles
        y: particles_per_sec
        ylabel: particles / second
        title: "Particle Throughput (fixed PPC)"
        filename: particles_per_sec.png
    speedup:
        x: n_particles
        xlabel: particles
        title: "Speedup over Jax Baseline (fixed PPC)"
        filename: speedup_vs_jax.png
