# @package _global_
# Constant grid (benchmark G=128), particle count up. Swept axis values live in
# conf/scaling/particle_count.yaml (shared with the NCU sweep).
defaults:
    - /scaling: particle_count
    - /plot@plots.time: loglog
    - /plot@plots.throughput: loglog
    - /plot@plots.speedup: speedup
    - _self_

tag: sweep_particle_count

plots:
    time:
        x: n_particles
        xlabel: particles
        y: ms_per_step
        ylabel: ms / substep
        title: "Time per step (fixed G)"
        filename: ms_per_substep.png
    throughput:
        x: n_particles
        xlabel: particles
        y: particles_per_sec
        ylabel: particles / second
        title: "Particle Throughput (fixed G)"
        filename: particles_per_sec.png
    speedup:
        x: n_particles
        xlabel: particles
        title: "Speedup over Jax Baseline (fixed G)"
        filename: speedup_vs_jax.png
