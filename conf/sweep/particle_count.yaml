# @package _global_
# Constant grid (G=96), particle count up. N is swept directly via
# hydra.sweeper.params; no per-point yaml needed.
defaults:
    - /plot@plots.time: loglog
    - /plot@plots.throughput: loglog
    - /plot@plots.speedup: speedup
    - _self_

hydra:
    sweeper:
        params:
            sim.n_particles: 1e5,5e5, 1e6, 5e6, 1e7

tag: sweep_particle_count

plots:
    time:
        x: n_particles
        xlabel: particles
        y: ms_per_step
        ylabel: ms / substep
        title: "Time per step (fixed G)"
        filename: ms_per_substep.png
    throughput:
        x: n_particles
        xlabel: particles
        y: particles_per_sec
        ylabel: particles / second
        title: "Particle Throughput (fixed G)"
        filename: particles_per_sec.png
    speedup:
        x: n_particles
        xlabel: particles
        title: "Speedup over Jax Baseline (fixed G)"
        filename: speedup_vs_jax.png
