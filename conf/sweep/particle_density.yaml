# @package _global_
# Fixed N, grid resolution up.
defaults:
    - /scaling: density
    - /plot@plots.time: loglog
    - /plot@plots.throughput: loglog
    - /plot@plots.speedup: speedup
    - _self_

tag: sweep_particle_density

plots:
    time:
        x: num_grids
        xlabel: grid resolution G
        y: ms_per_step
        ylabel: ms / substep
        title: "Time per step (fixed N)"
        filename: ms_per_substep.png
    throughput:
        x: num_grids
        xlabel: grid resolution G
        y: particles_per_sec
        ylabel: particles / second
        title: "Particle Throughput (fixed N)"
        filename: particles_per_sec.png
    speedup:
        x: num_grids
        xlabel: grid resolution G
        title: "Speedup over Jax Baseline (fixed N)"
        filename: speedup_vs_jax.png
