defaults:
    - config
    - nsight_metrics: full
    - optional nsight_sweep: null
    - nsight_plot: standard
    - override /sim: benchmark
    - _self_

render:
    enabled: false

# One Hydra job profiles ONE custom CUDA/cuTile backend variant with NCU.
# Select a serial multirun sweep with nsight_sweep=<choice>; each job appends
# to the sweep's results.parquet, and nsight_plot=<choice> renders figures from
# that aggregate at multirun end.
nsight:
    analyze:
        runs: 3
        # Kernel replay profiles the warmed backend scatter kernel directly.
        # Tiny XLA wrappers can still appear around cuTile scatter for some metric
        # sets; drop those, but do not combine real kernels by default. Nsight
        # Python still fails if more than one non-ignored kernel remains.
        replay_mode: kernel
        combine_kernel_metrics: null
        ignore_kernel_list:
            - loop_broadcast_fusion
            - wrapped_slice_1
            - wrapped_slice
# Keep Nsight outputs out of the timing-sweep tree. The sweep dir has no "runs"
# component, so each multirun aggregates into its own
# outputs/nsight/<gpu>/sweeps/<date>/<time>/results.parquet.
hydra:
    run:
        dir: outputs/nsight/${gpu_kind:}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    sweep:
        dir: outputs/nsight/${gpu_kind:}/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
        subdir: ${hydra.job.num}_${hydra.job.override_dirname}
    job:
        config:
            override_dirname:
                kv_sep: "="
                item_sep: ","
                exclude_keys:
                    - render.enabled
