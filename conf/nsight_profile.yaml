defaults:
    - config
    - nsight_metrics: full
    - _self_
    - nsight_plot: standard
    - optional nsight_sweep: null
    - override /sim: benchmark

render:
    enabled: false

# One job profiles ONE CUDA/cuTile backend with NCU
nsight:
    analyze:
        runs: 3
        # Kernel replay on the warmed scatter kernel
        replay_mode: kernel
        combine_kernel_metrics: null
        ignore_kernel_list:
            - loop_broadcast_fusion
            - wrapped_slice_1
            - wrapped_slice
# Keep Nsight outputs out of the timing-sweep tree
hydra:
    run:
        dir: outputs/nsight/${gpu_kind:}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    sweep:
        dir: outputs/nsight/${gpu_kind:}/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
        subdir: ${hydra.job.num}_${hydra.job.override_dirname}
    job:
        config:
            override_dirname:
                kv_sep: "="
                item_sep: ","
                exclude_keys:
                    - render.enabled
