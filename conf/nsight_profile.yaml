defaults:
  - config
  - override /sim: benchmark
  - _self_

render:
  enabled: false

# One Hydra job profiles ONE backend variant with NCU. Sweep across backends /
# particle counts with Hydra multirun (-m), e.g.:
#   pixi run python profile_nsight.py -cn nsight_profile -m \
#       backend=cuda_v1,cuda_v2,cuda_v3,cuda_v4,cutile_v1,cutile_v3 \
#       sim.n_particles=1000000
# then plot the sweep's results.parquet with postprocessing/nsight_plots.py.
nsight:
  analyze:
    runs: 1
    # Kernel replay profiles the warmed backend scatter kernel directly.
    # Tiny XLA wrappers can still appear around cuTile scatter for some metric
    # sets; drop those, but do not combine real kernels by default. Nsight
    # Python still fails if more than one non-ignored kernel remains.
    replay_mode: kernel
    # Direct NCU metrics. Postprocessing derives throughput, roofline,
    # occupancy, and contention columns from ProfileResults.to_dataframe().
    metrics:
      - gpu__time_duration.sum
      - smsp__sass_thread_inst_executed_op_fadd_pred_on.sum
      - smsp__sass_thread_inst_executed_op_fmul_pred_on.sum
      - smsp__sass_thread_inst_executed_op_ffma_pred_on.sum
      - sm__sass_thread_inst_executed_op_ffma_pred_on.sum.peak_sustained
      - sm__cycles_elapsed.avg.per_second
      - dram__bytes.sum
      - dram__bytes.sum.peak_sustained
      - dram__cycles_elapsed.avg.per_second
      - lts__lts2xbar_cycles_active.sum
      - lts__lts2xbar_cycles_active.sum.peak_sustained
      - lts__cycles_elapsed.avg.per_second
      - l1tex__lsu_writeback_active_mem_lg.sum
      - l1tex__lsu_writeback_active_mem_lg.sum.peak_sustained
      - l1tex__cycles_elapsed.avg.per_second
      - sm__throughput.avg.pct_of_peak_sustained_elapsed
      - gpu__compute_memory_throughput.avg.pct_of_peak_sustained_elapsed
      - dram__throughput.avg.pct_of_peak_sustained_elapsed
      - lts__throughput.avg.pct_of_peak_sustained_elapsed
      - l1tex__throughput.avg.pct_of_peak_sustained_elapsed
      - l1tex__t_requests_pipe_lsu_mem_global_op_red.sum
      - l1tex__t_requests_pipe_lsu_mem_global_op_atom.sum
      - l1tex__t_requests_pipe_lsu_mem_global_op_st.sum
      - l1tex__t_sectors_pipe_lsu_mem_global_op_red.sum
      - l1tex__t_sectors_pipe_lsu_mem_global_op_atom.sum
      - l1tex__t_sectors_pipe_lsu_mem_global_op_st.sum
      - l1tex__average_t_sectors_per_request_pipe_lsu_mem_global_op_red.ratio
      - lts__t_sectors_op_red.sum
      - lts__t_sectors_op_red.sum.pct_of_peak_sustained_elapsed
      - lts__d_atomic_input_cycles_active.sum.pct_of_peak_sustained_elapsed
      - smsp__average_warps_issue_stalled_lg_throttle_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_mio_throttle_per_issue_active.ratio
      - dram__bytes_read.sum
      - dram__bytes_write.sum
      - lts__t_sector_hit_rate.pct
      - lts__t_sectors_op_read.sum
      - lts__t_sectors_op_write.sum
      - l1tex__average_t_sectors_per_request_pipe_lsu_mem_global_op_ld.ratio
      - l1tex__t_sector_hit_rate.pct
      - sm__warps_active.avg.pct_of_peak_sustained_active
      - sm__maximum_warps_avg_per_active_cycle
      - launch__registers_per_thread
      - launch__shared_mem_per_block_static
      - launch__occupancy_limit_registers
      - launch__occupancy_limit_shared_mem
      - launch__occupancy_limit_warps
      - launch__occupancy_limit_blocks
      - smsp__issue_active.avg.pct_of_peak_sustained_active
      - smsp__average_warps_issue_stalled_long_scoreboard_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_short_scoreboard_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_barrier_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_math_pipe_throttle_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_wait_per_issue_active.ratio
      - smsp__average_warps_issue_stalled_not_selected_per_issue_active.ratio
    ignore_kernel_list:
      - loop_broadcast_fusion
      - wrapped_slice_1
      - wrapped_slice
# Keep Nsight outputs out of the timing-sweep tree. The sweep dir has no "runs"
# component, so each multirun aggregates into its own
# outputs/nsight/<gpu>/sweeps/<date>/<time>/results.parquet.
hydra:
  run:
    dir: outputs/nsight/${gpu_kind:}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/nsight/${gpu_kind:}/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        kv_sep: "="
        item_sep: ","
        exclude_keys:
          - render.enabled
