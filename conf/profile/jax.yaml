# JAX built-in trace — Chrome trace_events, viewable in Perfetto / TensorBoard.
# The trace is started AFTER warmup (see simulate.py:_run_jax_solver), so the
# one-time JIT compile + autotuning are excluded and only steady-state work is
# captured. Run a few frames of real substeps so the P2G/G2P kernels repeat.
name: jax

# Phase-barrier profiling mode (jax baseline). When true, the timestep is
# regrouped into the 3 classical MPM phases (P2G / Grid / G2P) with a
# jax.lax.optimization_barrier at each boundary, so XProf attributes device
# time per phase instead of one fused kernel. Identity transform — results are
# unchanged — but it prevents cross-phase fusion, so the per-phase times sum to
# MORE than the real fused frame (a measurement mode, not the optimized frame).
barriers: false

# Tracer levels (jax.profiler.ProfileOptions):
#   python_tracer_level=0 disables the Python call/import tracer, which would
#   otherwise add ~1e6 events and bury the device timeline. Set to 1 to capture
#   Python frames. host_tracer_level keeps the TraceMe annotations.
python_tracer_level: 0
host_tracer_level: 2

# GPU / CUPTI advanced knobs (-> ProfileOptions.advanced_configuration).
# Defaults are off; flip from the CLI, e.g. profile.gpu.nvtx=true.
gpu:
  nvtx: false               # gpu_enable_nvtx_tracking: capture Warp / NVTX-annotated CUDA ranges
  cuda_graph_trace: false   # gpu_enable_cupti_activity_graph_trace: see inside CUDA graphs (cuda_graph=true)
  graph_node_mapping: false # gpu_dump_graph_node_mapping: map graph nodes -> kernels
  max_activity_events: null # gpu_max_activity_api_events (null = CUPTI default 2*1024*1024); raise for long traces
  max_callback_events: null # gpu_max_callback_api_events
  pm_sample_counters: null  # gpu_pm_sample_counters: comma-separated PM metric string (overlaps ncu/nsight)
