# cuda_v4_inline — super-cell-major + 6^3 shared-memory tile + inline per-particle
# weight/momentum computation. JAX sorts particles by home cell every substep
# and passes (sorted x, v, C, stress, cell_start CSR) to one CUDA launch with
# one block per 4^3 super-cell. Each block aggregates contributions into a
# 6^3 smem tile before flushing to HBM with one atomicAdd per node — testing
# whether the coarser particle-block granularity amortises tile overhead while
# preserving smem aggregation. Per-frame only.
_target_: mpm_jax.backends.CudaV4
num_grids: ${sim.num_grids}
# Super-cell width SC. The kernel is templated + dispatched over {2, 4, 8}, so
# this is selectable without a recompile; num_grids must be divisible by it.
super_cell_width: 4
