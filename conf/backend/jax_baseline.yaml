# The JAX/XLA baseline: lax.scan over the 27 stencil offsets for BOTH P2G and
# G2P, the unified MLS-MPM G2P (the APIC affine matrix C is reused as the
# velocity gradient for the F-update), and the scatter-free Jacobi SVD for
# stress + plasticity. Every other kernel reuses this exact G2P, so across the
# registry only the P2G implementation varies.
_target_: mpm_jax.backends.Backend
num_grids: ${sim.num_grids}
