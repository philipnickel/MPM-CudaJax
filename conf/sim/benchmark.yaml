# @package _global_
# Standard high-performance benchmark configuration used by the current
# profiling suite: 10 substeps, 10M particles in [0.1, 0.9]^3 over a 128^3
# grid (dx = 7.8125e-3), about 102^3 active cells and ~9.3 particles per
# active cell.
#
#   pixi run python simulate.py -cn config sim=benchmark backend=cuda_v3 material=jelly
sim:
    num_frames: 1
    steps_per_frame: 10
    n_particles: 10000000
    initial_velocity: [0.0, 0.0, 0.0]
    num_grids: 128
    dt: 5.0e-5 # CFL-safe for the jelly material at this grid resolution.
    gravity: [0.0, 0.0, -9.8]
    rho: 1000.0
    clip_bound: 0.5
    damping: 1.0
    center: [0.5, 0.5, 0.5]
    size: [0.8, 0.8, 0.8] # particles fill [0.1, 0.9]^3; per-particle vol = 0.8^3 / n

render:
    enabled: false
