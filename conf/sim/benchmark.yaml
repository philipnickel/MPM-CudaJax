# @package _global_
# Standard benchmark: 10M particles, 128^3 grid
sim:
    num_frames: 1
    steps_per_frame: 10
    n_particles: 10000000
    initial_velocity: [0.0, 0.0, 0.0]
    num_grids: 128
    dt: 5.0e-5 # CFL-safe for jelly
    gravity: [0.0, 0.0, -9.8]
    rho: 1000.0
    clip_bound: 0.5
    damping: 1.0
    center: [0.5, 0.5, 0.5]
    size: [0.8, 0.8, 0.8] # fills [0.1, 0.9]^3

render:
    enabled: false
