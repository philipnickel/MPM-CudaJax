# Standard high-performance benchmark configuration.
# Uses an even grid divisible by the super-cell width (4) so JAX, CUDA, and the
# super-cell-tiled cuTile/CUDA kernels can all run the same apples-to-apples
# preset. Close to the Taichi / MLS-MPM 8 ppc setup: 10M particles in
# [0.1, 0.9]^3 over a 132^3 grid (dx ~= 7.6e-3) -> ~106^3 active cells, ~8.4 ppc.
#
#   pixi run python simulate.py -cn config sim=benchmark \
#       backend=cuda_v3 material=jelly render.enabled=false
num_frames: 1
steps_per_frame: 50
n_particles: 10000000
initial_velocity: [0.0, 0.0, 0.0]
num_grids: 96 # even & divisible by the super-cell width (4); ~8.4 ppc at 10M
dt: 5.0e-5 # CFL: c=sqrt(E/rho)~45 m/s, dx~=7.6e-3 -> dt_max~1.7e-4; 5e-5 is safe
gravity: [0.0, 0.0, -9.8]
rho: 1000.0
clip_bound: 0.5
damping: 1.0
center: [0.5, 0.5, 0.5]
size: [0.8, 0.8, 0.8] # particles fill [0.1, 0.9]^3; per-particle vol = 0.8^3 / n
