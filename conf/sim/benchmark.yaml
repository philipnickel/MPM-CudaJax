# Standard high-performance benchmark configuration.
# Uses an even grid so JAX, inline CUDA, and the super-cell-tiled cuTile/CUDA
# kernels can all run the same apples-to-apples preset. This is close to the Taichi /
# MLS-MPM 8 ppc setup: dx ~= 8.06e-3, particles in [0.1, 0.9]^3, 8M particles.
#
#   pixi run python simulate.py -cn config sim=benchmark \
#       backend=cuda_v3 material=jelly benchmark=true
num_frames: 1
steps_per_frame: 100
n_particles: 10000000
initial_velocity: [0.0, 0.0, 0.0]
num_grids: 100 # even grid required by the super-cell-tiled cuTile/CUDA kernels
dt: 5.0e-5 # CFL: c=sqrt(E/rho)~45 m/s, dx=8e-3 -> dt_max~9e-5; 5e-5 is safe
gravity: [0.0, 0.0, -9.8]
rho: 1000.0
clip_bound: 0.5
damping: 1.0
center: [0.5, 0.5, 0.5]
size: [0.8, 0.8, 0.8] # particles fill [0.1, 0.9]^3; per-particle vol = 0.8^3 / n
boundary_conditions:
    - point: [1.0, 1.0, 0.02]
      normal: [0.0, 0.0, 1.0]
      start_time: 0.0
      end_time: 1e3
