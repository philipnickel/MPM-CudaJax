# Standard high-performance benchmark configuration used by the current
# profiling suite: 10M particles in [0.1, 0.9]^3 over a 96^3 grid
# (dx ~= 1.04e-2), about 77^3 active cells and ~22 particles per active cell.
#
#   pixi run python simulate.py -cn config sim=benchmark \
#       backend=cuda_v3 material=jelly render.enabled=false
num_frames: 1
steps_per_frame: 50
n_particles: 10000000
initial_velocity: [0.0, 0.0, 0.0]
num_grids: 96
dt: 5.0e-5 # CFL-safe for the jelly material at this grid resolution.
gravity: [0.0, 0.0, -9.8]
rho: 1000.0
clip_bound: 0.5
damping: 1.0
center: [0.5, 0.5, 0.5]
size: [0.8, 0.8, 0.8] # particles fill [0.1, 0.9]^3; per-particle vol = 0.8^3 / n
