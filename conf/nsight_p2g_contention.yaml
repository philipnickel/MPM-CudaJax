# Atomic/scatter and memory-locality data for isolated P2G variants.
#
# These metrics are additive counts/bytes plus timing, so kernel replay with
# sum aggregation is appropriate for multi-kernel annotated regions.
#
# Run:
#   pixi run -e gpu python profile_nsight.py -cn nsight_p2g_contention
defaults:
  - nsight_profile
  - _self_

kernel:
  name: cuda_v1_inline

nsight:
  analyze:
    runs: 1
    metric_presets:
      - time
      - memory_locality
      - atomics
    derive_metric: diagnostics
    replay_mode: kernel
    combine_kernel_metrics: sum
    output_csv: true
  plot:
    enabled: false
    metric: global_atomic_or_reduction_requests_per_particle
    ylabel: Global atomic/reduction requests per particle
    filename: nsight_p2g_contention.png
    title: P2G Atomic and Scatter Pressure
  sweep:
    kernels:
      - cuda_v1_inline
      - cuda_v2_inline
      - cuda_v3_inline
      - cuda_v4_inline
      - cutile_v6_atomic_tile
    n_particles:
      - 65536
    num_grids:
      - 32
    steps_per_frame:
      - 1

sim:
  n_particles: 65536
  num_grids: 32
  num_frames: 1
  steps_per_frame: 1
