# Dedicated XProf trace run: the standard benchmark preset, shortened to a
# couple of frames so the capture stays small. Profiling is on and rendering
# off. Traces land in traces/<backend>/ (+ optimized_hlo.txt); view with
#   pixi run xprof --logdir traces
#
#   pixi run python simulate.py -cn trace backend=cutile_v3
#   pixi run python simulate.py -cn trace -m backend=jax,cuda_v3,cutile_v3
defaults:
  - config
  - override /sim: benchmark
  - _self_

render:
  enabled: false

profile:
  enabled: true
  dump_hlo: true   # write optimized_hlo.txt (ops carry op_name scope + source) next to the trace

sim:
  steps_per_frame: 5
  num_frames: 2
