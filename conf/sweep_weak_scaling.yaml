# Backend x weak-scaling sweep at fixed active-cell PPC.
#
# The scale choices keep particles_per_active_cell ~= 8.492, matching the
# benchmark density implied by N=10M, G=132, and the 0.8^3 material volume:
#   G = 32, 64, 96, 128, 160, 192
#
# Run:
#   pixi run python simulate.py -cn sweep_weak_scaling
defaults:
    - config
    - override /sim: benchmark
    - _self_

hydra:
    mode: MULTIRUN
    sweeper:
        params:
            backend: jax,cuda_v1,cuda_v2,cuda_v3,cuda_v4,cutile_v1,cutile_v3
            scale: weak_g32,weak_g64,weak_g96,weak_g128,weak_g160,weak_g192

render:
    enabled: false
tag: sweep_weak_scaling
